[package]
name = "kestrel"
description = "Autopilot client: bidding, word play, onboarding, telemetry and replay."
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
authors = ["NikkeTryHard"]
repository = "https://github.com/NikkeTryHard/kestrel"
publish = false

[[bin]]
name = "kestrel"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
kestrel-market = { path = "../kestrel-market" }
kestrel-net = { path = "../kestrel-net" }
kestrel-policy = { path = "../kestrel-policy" }
kestrel-words = { path = "../kestrel-words" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spacetimedb-sdk = "=2.13.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
